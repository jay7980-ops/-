    `<div class="disc">※ 현물=순매수 거래대금(억·pykrx/KRX) · 선물=코스피200 근월물 순매수 환산 억원(계약×종가×25만승수·다음금융). 실데이터.</div>`;
})();

const FEAT = {

(function(){

    `<div class="news">${FEAT.lines.map(l=>'• '+l).join('<br>')}</div>`+

})();

// ── 펀드 자금 흐름 (미국/한국) · 주간 단위 수동 갱신 ──
const FLOW = {
  asof:'2026-10-30',
  us:[
    "반도체 ETF(SOXX·SMH) — AI 주도로 자금 지속 유입(10월 말 주간 +$5B대).",

(function(){

    `<div class="mtxt" style="font-weight:700;color:#1a7f37;margin:10px 0 4px">🇰🇷 한국 (외국인·기관 수급)</div>`+ li(FLOW.kr)+
    `<div class="disc">※ ETF플로우·수급 기반 근사치(주간 단위 수동 갱신). 실시간 장부 아님, 매매권유 아님.</div>`;

// ── 투자 시즌 시계 & KRE 신용위기 게이지 (정보용, 매매권유 아님) ──
const KRE = {"px": 72.88, "ma200": 71.24, "hi52": 77.93, "ddHi": -6.5, "vsMa": 2.3, "asof": "2026-11-04"};
function modCard(id,icon,title,badge,badgeCls,txt,extra){
  document.getElementById(id).innerHTML =
    `<div class="ctitle">${icon} ${title}</div>`+
    `<div class="mod"><span class="badge ${badgeCls}">${badge}</span><div class="mtxt">${txt}</div></div>`+
    (extra||'')+
    `<div class="disc">※ 통계적 경향·참고 지표일 뿐 매매 권유가 아니며, 투자 판단과 책임은 본인에게 있습니다.</div>`;
}
(function(){
  const m = new Date().getMonth()+1;
  const inS = (m>=10 || m<=4);
  if(inS) modCard('season','🗓️','투자 시즌 시계','🟢 투자 시즌 (10~4월)','g-on',
    `현재 <span class="mnum">${m}월</span> — 역사적으로 수익률이 상대적으로 좋았던 6개월 구간(이른바 'Halloween effect', 11~4월과 겹침). 유동성이 줄어드는 5월 전후까지가 통계적 선호 구간. <b>경향일 뿐 보장은 아님.</b>`);
  else modCard('season','🗓️','투자 시즌 시계','⚪ 비시즌 (5~9월)','g-off',
    `현재 <span class="mnum">${m}월</span> — 역사적으로 평균 수익률이 낮았던 구간. 신규 베팅보다 리스크 관리·현금비중 우선 고려.`);

  let kc,kb,kt;
  if(KRE.px<KRE.ma200 && KRE.ddHi<=-20){kc='g-red';kb='🔴 경보';kt='200일선 이탈 + 고점대비 -20% 이상 — 2023년 SVB형 신용 스트레스 구간. 방어적 대응 고려.';}
  else if(KRE.px<KRE.ma200 || KRE.ddHi<=-10){kc='g-mid';kb='🟡 주의';kt='추세 약화 — 하이일드 스프레드·국채금리·안전자산 흐름과 교차 확인 필요.';}
  else {kc='g-on';kb='🟢 안정';kt='200일선 위 + 고점대비 조정 완만 — 광범위한 신용위기 신호는 아님.';}
  modCard('kre','🏦','KRE 미 지역은행 — 신용위기 게이지',kb,kc,kt,
    `<div class="mtxt" style="margin-top:8px"><span class="mnum">$${KRE.px}</span> · 200일선 $${KRE.ma200} (<span style="color:${KRE.px>=KRE.ma200?'#d6213a':'#0969da'}">${KRE.vsMa>0?'+':''}${KRE.vsMa}%</span>) · 52주고점대비 ${KRE.ddHi}% · 기준 ${KRE.asof}</div>`);
})();

// ── 월별 계절성 통계 (정보용) — 1996~2026, 월말종가 전월대비, 출처 Yahoo Finance ──
const SEAS = {
  yr:'1996~2026',
  kr:[0.31,0.37,3.18,0.69,0.59,0.88,-0.87,-1.17,-0.95,2.88,2.06,3.27],
  krH:[53,57,63,53,50,60,43,57,43,59,60,62],
  us:[0.35,-0.31,0.90,2.05,0.79,0.38,1.45,-0.47,-0.86,1.45,2.33,0.87],
  usH:[57,50,60,73,70,63,63,57,50,58,79,67]
};
(function(){
  const cm = new Date().getMonth();
  function grid(arr,hit){
    let h='<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px">';
    for(let i=0;i<12;i++){
      const v=arr[i], col=v>0?'#d6213a':(v<0?'#0969da':'#656d76');
      const cur=i===cm?'border:2px solid #1f6feb;':'border:1px solid #d8dee4;';
      h+=`<div style="${cur}border-radius:8px;padding:4px 2px;text-align:center;background:#f6f8fa">`+
         `<div style="font-size:10px;color:#656d76">${i+1}월</div>`+
         `<div style="font-size:12px;font-weight:800;color:${col};font-variant-numeric:tabular-nums">${v>0?'+':''}${v.toFixed(1)}%</div>`+
         `<div style="font-size:9px;color:#8c959f">↑${hit[i]}%</div></div>`;
    }
    return h+'</div>';
  }
  const curCol = a => a>0?'#d6213a':(a<0?'#0969da':'#656d76');
  const body =
    `<div class="mtxt" style="margin-top:4px">🇰🇷 <b>코스피</b> — 강세월 <b>12·3월</b>, 약세월 <b>7·8·9월</b>(여름). 현재 ${cm+1}월 평균 <span class="mnum" style="color:${curCol(SEAS.kr[cm])}">${SEAS.kr[cm]>0?'+':''}${SEAS.kr[cm]}%</span> · 상승확률 ${SEAS.krH[cm]}%</div>`+
    grid(SEAS.kr,SEAS.krH)+
    `<div class="mtxt" style="margin-top:12px">🇺🇸 <b>S&amp;P500</b> — 강세월 <b>11·4월</b>, 약세월 <b>9월</b>(연중 최약). 현재 ${cm+1}월 평균 <span class="mnum" style="color:${curCol(SEAS.us[cm])}">${SEAS.us[cm]>0?'+':''}${SEAS.us[cm]}%</span> · 상승확률 ${SEAS.usH[cm]}%</div>`+
    grid(SEAS.us,SEAS.usH);
  document.getElementById('seas2').innerHTML =
    `<div class="ctitle">📅 월별 계절성 통계 (${SEAS.yr})</div>`+body+
    `<div class="disc">월말종가 전월대비 평균수익률·상승확률 · 출처 Yahoo Finance · ↑=상승 마감한 해의 비율 · 과거 통계일 뿐 미래 보장이 아님. ※ '국감(10월) 약세' 속설은 이 30년 데이터에선 성립하지 않음(10월은 오히려 강세).</div>`;
})();

// ── 경제지표·실적 일정 (예정일, 변동 가능) — 과거 항목 자동 숨김 ──
const CAL = [
  {d:'2026-11-10', fl:'🇺🇸', t:'10월 CPI 소비자물가', k:'지표'},
  {d:'2026-11-17', fl:'🇺🇸', t:'엔비디아(NVDA) FY27 3분기 실적 · 장마감 후', k:'실적'},
  {d:'2026-11-26', fl:'🇰🇷', t:'한국은행 금통위 기준금리 결정 (올해 마지막)', k:'지표'},
  {d:'2026-12-09', fl:'🇺🇸', t:'FOMC 기준금리 결정 + 점도표(SEP)', k:'지표'},
  {d:'2026-12-10', fl:'🇺🇸', t:'11월 CPI 소비자물가', k:'지표'}
];
(function(){
  const today=new Date(); today.setHours(0,0,0,0);
  const up=CAL.map(e=>{const dt=new Date(e.d+'T00:00:00');return Object.assign({},e,{dd:Math.round((dt-today)/86400000)});})
             .filter(e=>e.dd>=0).sort((a,b)=>a.dd-b.dd);
  let h=`<div class="ctitle">🗓️ 다가오는 주요 일정</div>`;
  if(!up.length) h+=`<div class="mtxt" style="margin-top:6px">표시할 예정 일정이 없습니다 — 일정 갱신이 필요합니다.</div>`;
  up.forEach(e=>{
    const dlab=e.dd===0?'D-DAY':`D-${e.dd}`;
    const kc=e.k==='실적'?'#8250df':'#1f6feb';
    h+=`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #eef1f4">`+
       `<span style="font-variant-numeric:tabular-nums;font-size:11px;font-weight:800;color:${e.dd<=3?'#d6213a':'#656d76'};min-width:46px">${dlab}</span>`+
       `<span style="font-size:11px;color:#656d76;min-width:52px">${e.d.slice(5)}</span>`+
       `<span style="font-size:12.5px;color:#1f2328;flex:1">${e.fl} ${e.t}</span>`+
       `<span style="font-size:9px;color:#fff;background:${kc};border-radius:6px;padding:1px 6px;white-space:nowrap">${e.k}</span></div>`;
  });
  h+=`<div class="disc">예정일은 변동될 수 있음 · 美 고용보고서(NFP)는 통상 매월 첫째 금요일 · 출처: Fed/BLS/한국은행/기업 IR. 일정은 주기적으로 갱신 필요.</div>`;
  document.getElementById('cal').innerHTML=h;
})();
const chg = r => { const c = r>0?'up':(r<0?'dn':'fl'); const s = r>0?'+':''; return `<span class="chg ${c}">${s}${r.toFixed(2)}%</span>`; };
const amt = a => `<span class="amt">${a.toLocaleString()}<span class="u">억</span></span>`;
function bothCard(title, arr){
  let h = `<div class="card"><div class="ctitle"><span class="dot gdot"></span>⭐ ${title}</div>`;
  if(!arr.length) h+=`<div class="row" style="color:#8c959f">동반 순매수 종목 없음</div>`;
  arr.forEach((x,i)=>{ h+=`<div class="brow"><div class="bhead"><span class="rk g">${i+1}</span><span class="nm">${x.n}<span class="cd">${x.c}</span></span>${chg(x.r)}<span class="sum">${x.s.toLocaleString()}억</span></div><div class="bsub"><span class="f">외인 ${x.f.toLocaleString()}억</span><span class="i">기관 ${x.i.toLocaleString()}억</span></div></div>`; });
  return h+`</div>`;
}
function listCard(title, dotcls, arr){
  let h = `<div class="card"><div class="ctitle"><span class="dot ${dotcls}"></span>${title}</div>`;
  arr.forEach((x,i)=>{ h+=`<div class="row"><span class="rk">${i+1}</span><span class="nm">${x.n}<span class="cd">${x.c}</span></span>${chg(x.r)}${amt(x.a)}</div>`; });
  return h+`</div>`;
}
function render(m){
  const v=document.getElementById('view');
  if(m==='kospi'){
    v.innerHTML = bothCard('외인+기관 동반 순매수 · KOSPI', D.bk)
      + listCard('외국인 순매수 상위 · KOSPI','fdot',D.fk)
      + listCard('기관 순매수 상위 · KOSPI','idot',D.ik);
  } else {
    v.innerHTML = bothCard('외인+기관 동반 순매수 · KOSDAQ', D.bd2)
      + listCard('외국인 순매수 상위 · KOSDAQ','fdot',D.fd)
      + listCard('기관 순매수 상위 · KOSDAQ','idot',D.id);
  }
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); render(b.dataset.m); window.scrollTo({top:0,behavior:'smooth'});
}));
render('kospi');
</script>

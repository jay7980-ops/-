function listCard(title, dotcls, arr){
  let h = `<div class="card"><div class="ctitle"><span class="dot ${dotcls}"></span>${title}</div>`;
  arr.forEach((x,i)=>{ h+=`<div class="row"><span class="rk">${i+1}</span><span class="nm">${x.n}<span class="cd">${x.c}</span></span>${chg(x.r)}${amt(x.a)}</div>`; });
  return h+`</div>`;
}
function render(m){
  const v=document.getElementById('view');
  if(m==='kospi'){
    v.innerHTML = bothCard('외인+기관 동반 순매수 · KOSPI', D.bk)
      + listCard('외국인 순매수 상위 · KOSPI','fdot',D.fk)
      + listCard('기관 순매수 상위 · KOSPI','idot',D.ik);
  } else {
    v.innerHTML = bothCard('외인+기관 동반 순매수 · KOSDAQ', D.bd2)
      + listCard('외국인 순매수 상위 · KOSDAQ','fdot',D.fd)
      + listCard('기관 순매수 상위 · KOSDAQ','idot',D.id);
  }
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); render(b.dataset.m);
}));
render('kospi');
</script>
</body></html>
